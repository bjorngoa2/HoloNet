# dnsmasq config for HoloNet's local *.goa.no DNS resolution.
#
# This lets every device on the home LAN resolve portal.goa.no, videos.goa.no,
# photos.goa.no and games.goa.no to this server's LAN IP, so Nginx's
# Host-header routing (see nginx/nginx.conf) actually works from any device
# without editing hosts files everywhere. Every other domain is forwarded to
# a public upstream resolver, so normal internet browsing is unaffected.
#
# IMPORTANT: replace 192.168.0.10 below with this server's actual LAN IP
# (reserve it via the router's DHCP "Address Reservation" so it never
# changes), then set the router's "Primary DNS" (under DHCP Server settings)
# to that same IP so all devices are told to use this server for DNS.

# Don't read /etc/resolv.conf or /etc/hosts from the container — only serve
# what's explicitly configured below.
no-resolv
no-hosts

# Public upstream DNS servers for everything that isn't *.goa.no.
server=1.1.1.1
server=1.0.0.1

# Local HoloNet subdomains -> this server's LAN IP.
address=/portal.goa.no/192.168.0.61
address=/videos.goa.no/192.168.0.61
address=/photos.goa.no/192.168.0.61
address=/games.goa.no/192.168.0.61

# Don't act as a DHCP server — the router already handles DHCP; dnsmasq here
# is DNS-only.
no-dhcp-interface=eth0

# Log queries to stdout (visible via `docker compose logs dnsmasq`) — useful
# for confirming devices are actually using this resolver.
log-queries
