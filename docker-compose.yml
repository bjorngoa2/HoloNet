name: holonet

services:

  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
    networks:
      - holonet
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_TEST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - holonet-portal
      - holonet-video
      - holonet-photos
      - holonet-games
    networks:
      - holonet
    restart: unless-stopped

  holonet-portal:
    image: ghcr.io/bjorngoa2/holonet-portal:${IMAGE_TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Portal__VideoUrl=http://videos.goa.no
      - Portal__PhotosUrl=http://photos.goa.no
      - Portal__GamesUrl=http://games.goa.no
    networks:
      - holonet
    restart: unless-stopped

  holonet-video:
    image: ghcr.io/bjorngoa2/holonet-video:${IMAGE_TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - VideoService__VideoPath=/data/videos
      - VideoService__BaseUrl=http://videos.goa.no/api/v1/videos
    volumes:
      - ./data/videos:/data/videos:ro
    networks:
      - holonet
    restart: unless-stopped

  holonet-photos:
    image: ghcr.io/bjorngoa2/holonet-photos:${IMAGE_TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PhotoService__PhotoPath=/data/photos
      - PhotoService__BaseUrl=http://photos.goa.no/api/v1/photos
    volumes:
      - ./data/photos:/data/photos:ro
    networks:
      - holonet
    restart: unless-stopped

  holonet-games:
    image: ghcr.io/bjorngoa2/holonet-games:${IMAGE_TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - GameService__GamePath=/data/games
      - GameService__BaseUrl=http://games.goa.no/api/v1/games
    volumes:
      - ./data/games:/data/games:ro
    networks:
      - holonet
    restart: unless-stopped

networks:
  holonet:
    driver: bridge

