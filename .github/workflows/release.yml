name: Release

on:
  push:
    tags:
      - 'v*'
  # Releasing without pushing a tag, e.g. from the Actions tab or a session whose git access
  # can't push tags: run it on main (or a release/* branch) with the version, and the release
  # step creates the v<version> tag on that commit once everything has built.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.4.0 (tagged v1.4.0 on the chosen branch)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # ghcr.io requires lowercase image names; github.repository_owner is already lowercase for
  # this org/user, but this normalizes it in case that ever changes.
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # The tag and version every other job uses: the pushed tag, or the one a manual run asked for.
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="${INPUT_VERSION#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$INPUT_VERSION' is not a version like 1.4.0."
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != refs/heads/release/* ]]; then
              echo "::error::Run the release on main or a release/* branch, not '$GITHUB_REF_NAME'."
              exit 1
            fi
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "::error::$tag already exists. Pick a new version."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  publish-images:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Portal (React/Vite dashboard) is excluded for now — HoloNet is used via TvLauncher,
        # so Portal isn't needed for a working release. Re-add "portal" here once its
        # ClientApp frontend is ready to ship.
        service: [video, photos, games]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          service="${{ matrix.service }}"
          # e.g. "video" -> "HoloNet.Video" to match the Dockerfile/project naming convention.
          project="HoloNet.${service^}"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/holonet-$service" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.image.outputs.project }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.resolve-version.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest

  publish-tvlauncher:
    needs: resolve-version
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
      VELOPACK_ID: HoloNetTvLauncher
      PUBLISH_DIR: ${{ github.workspace }}/publish/TvLauncher
      VELOPACK_OUTPUT_DIR: ${{ github.workspace }}/artifacts/velopack
      VPK_VERSION: '1.2.0'
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish TvLauncher (self-contained, win-x64)
        run: >
          dotnet publish HoloNet.TvLauncher/HoloNet.TvLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }}
          -p:PublishSingleFile=false
          -o ${{ env.PUBLISH_DIR }}

      # Bundled next to the launcher so appsettings.json's relative "PrimePlayerToolPath" finds it
      # (Prime Video, Disney+ and HBO Max auto-play). Same runtime as the launcher, so the shared
      # self-contained runtime files it writes are identical.
      - name: Publish PrimePlayer into the launcher folder
        run: >
          dotnet publish HoloNet.PrimePlayer/HoloNet.PrimePlayer.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }}
          -p:PublishSingleFile=false
          -o ${{ env.PUBLISH_DIR }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Download previous release (for delta packages)
        shell: pwsh
        # Best-effort: there's nothing to diff against for the very first Velopack-packaged
        # release, so a failure here (no prior releases.win.json feed yet) is expected and
        # shouldn't fail the job — vpk pack still produces a full (non-delta) package either way.
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VELOPACK_OUTPUT_DIR }}" | Out-Null
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir "${{ env.VELOPACK_OUTPUT_DIR }}" --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Pack Velopack release
        shell: pwsh
        run: |
          vpk pack `
            --packId "${{ env.VELOPACK_ID }}" `
            --packVersion "${{ env.RELEASE_VERSION }}" `
            --packDir "${{ env.PUBLISH_DIR }}" `
            --mainExe "HoloNet.TvLauncher.exe" `
            --outputDir "${{ env.VELOPACK_OUTPUT_DIR }}" `
            --packAuthors "bjorngoa2" `
            --packTitle "HoloNet TV Launcher"

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v7
        with:
          name: tvlauncher-velopack
          path: ${{ env.VELOPACK_OUTPUT_DIR }}/**
          if-no-files-found: error

  create-release:
    needs: [resolve-version, publish-images, publish-tvlauncher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tvlauncher-velopack
          path: velopack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # On a manual run the tag doesn't exist yet, so this creates it on the commit that was
          # built; on a tag push it's that tag and target_commitish is ignored.
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # Every file Velopack produces must be uploaded together — the full/delta .nupkg's,
          # the Setup.exe installer, and releases.win.json (the update feed UpdateManager reads
          # to discover new versions; see HoloNet.TvLauncher/Services/AppUpdateService.cs).
          files: velopack/*
