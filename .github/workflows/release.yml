name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  # ghcr.io requires lowercase image names; github.repository_owner is already lowercase for
  # this org/user, but this normalizes it in case that ever changes.
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Portal (React/Vite dashboard) is excluded for now — HoloNet is used via TvLauncher,
        # so Portal isn't needed for a working release. Re-add "portal" here once its
        # ClientApp frontend is ready to ship.
        service: [video, photos, games]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          service="${{ matrix.service }}"
          # e.g. "video" -> "HoloNet.Video" to match the Dockerfile/project naming convention.
          project="HoloNet.${service^}"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/holonet-$service" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.image.outputs.project }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest

  publish-tvlauncher:
    runs-on: windows-latest
    env:
      VELOPACK_ID: HoloNetTvLauncher
      PUBLISH_DIR: ${{ github.workspace }}/publish/TvLauncher
      VELOPACK_OUTPUT_DIR: ${{ github.workspace }}/artifacts/velopack
      VPK_VERSION: '1.2.0'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish TvLauncher (self-contained, win-x64)
        run: >
          dotnet publish HoloNet.TvLauncher/HoloNet.TvLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=false
          -o ${{ env.PUBLISH_DIR }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Download previous release (for delta packages)
        shell: pwsh
        # Best-effort: there's nothing to diff against for the very first Velopack-packaged
        # release, so a failure here (no prior releases.win.json feed yet) is expected and
        # shouldn't fail the job — vpk pack still produces a full (non-delta) package either way.
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VELOPACK_OUTPUT_DIR }}" | Out-Null
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir "${{ env.VELOPACK_OUTPUT_DIR }}" --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Pack Velopack release
        shell: pwsh
        run: |
          vpk pack `
            --packId "${{ env.VELOPACK_ID }}" `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir "${{ env.PUBLISH_DIR }}" `
            --mainExe "HoloNet.TvLauncher.exe" `
            --outputDir "${{ env.VELOPACK_OUTPUT_DIR }}" `
            --packAuthors "bjorngoa2" `
            --packTitle "HoloNet TV Launcher"

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: tvlauncher-velopack
          path: ${{ env.VELOPACK_OUTPUT_DIR }}/**
          if-no-files-found: error

  create-release:
    needs: [publish-images, publish-tvlauncher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tvlauncher-velopack
          path: velopack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Every file Velopack produces must be uploaded together — the full/delta .nupkg's,
          # the Setup.exe installer, and releases.win.json (the update feed UpdateManager reads
          # to discover new versions; see HoloNet.TvLauncher/Services/AppUpdateService.cs).
          files: velopack/*
