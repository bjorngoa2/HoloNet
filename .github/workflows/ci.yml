name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  build:
    # windows-latest so the TvLauncher WPF project (net10.0-windows) builds too, alongside
    # the four cross-platform web services — one job covers the whole solution.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HoloNet.slnx

      - name: Build
        run: dotnet build HoloNet.slnx --configuration Release --no-restore
