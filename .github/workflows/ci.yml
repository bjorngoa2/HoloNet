name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Lets the "Update screenshots" workflow re-run CI on the commit it pushes, since a push made
  # with the workflow token doesn't trigger workflows by itself.
  workflow_dispatch:

jobs:
  build:
    # Windows so the TvLauncher WPF project (net10.0-windows) builds and its screenshot tests
    # render, alongside the cross-platform web services — one job covers the whole solution.
    # Pinned rather than windows-latest: screenshots only compare when rendered on the same
    # Windows image, so keep this in step with update-screenshots.yml.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HoloNet.slnx

      - name: Build
        run: dotnet build HoloNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HoloNet.slnx --configuration Release --no-build

      - name: Upload screenshots that don't match
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-screenshots
          path: HoloNet.TvLauncher.Tests/Screenshots/Received/
          if-no-files-found: ignore
