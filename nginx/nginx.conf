events {}

http {
    # Only allow requests from the home LAN. Anything else (including the public
    # internet, if this port were ever accidentally exposed) is rejected outright.
    # Adjust this if the server's LAN subnet differs from 192.168.0.0/24.
    geo $lan_client {
        default        0;
        192.168.0.0/24 1;
        127.0.0.1      1;
    }

    # Reject requests with unrecognized Host headers instead of falling through
    # to the first defined server block (portal).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name portal.goa.no;

        if ($lan_client = 0) { return 403; }

        location / {
            proxy_pass         http://holonet-portal:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 80;
        server_name videos.goa.no;

        if ($lan_client = 0) { return 403; }

        # Increase buffer for video streaming
        proxy_buffering    off;
        proxy_read_timeout 300s;

        location / {
            proxy_pass         http://holonet-video:8080;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Range $http_range;
            proxy_set_header   If-Range $http_if_range;
        }
    }

    server {
        listen 80;
        server_name photos.goa.no;

        if ($lan_client = 0) { return 403; }

        location / {
            proxy_pass         http://holonet-photos:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 80;
        server_name games.goa.no;

        if ($lan_client = 0) { return 403; }

        location / {
            proxy_pass         http://holonet-games:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

